version: '3.8'

services:
  # 1. Cấu hình Dịch vụ Database tích hợp AI
  postgres_db:
    image: pgvector/pgvector:pg16 
    container_name: bookstore_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
      POSTGRES_DB: ${DB_DATABASE:-bookstore_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bookstore_network

  # 2. Cấu hình Dịch vụ Backend NestJS
  backend_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: bookstore_backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      EXP_DEFAULT: ${EXP_DEFAULT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DISCORD_WEBHOOK_URL_LOG: ${DISCORD_WEBHOOK_URL_LOG}
      DISCORD_WEBHOOK_URL_UPDATE: ${DISCORD_WEBHOOK_URL_UPDATE}
      DISCORD_WEBHOOK_URL_ORDER: ${DISCORD_WEBHOOK_URL_ORDER}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - bookstore_network

volumes:
  pgdata:
    driver: local

networks:
  bookstore_network:
    driver: bridge