version: '3.8'

services:
  # 1. Database pgvector
  postgres_db:
    image: pgvector/pgvector:pg16
    container_name: bookstore_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password_here}
      POSTGRES_DB: ${DB_DATABASE:-bookshop_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bookshop_network
    # --- KHỐI BỔ SUNG HEALTHCHECK ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-bookshop_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend NestJS
  backend_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: bookstore_backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      EXP_DEFAULT: ${EXP_DEFAULT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DISCORD_WEBHOOK_URL_LOG: ${DISCORD_WEBHOOK_URL_LOG}
      DISCORD_WEBHOOK_URL_UPDATE: ${DISCORD_WEBHOOK_URL_UPDATE}
      DISCORD_WEBHOOK_URL_ORDER: ${DISCORD_WEBHOOK_URL_ORDER}
    # --- CẬP NHẬT DEPENDS_ON ĐỂ CHỜ HEALTHCHECK ---
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - bookshop_network

volumes:
  pgdata:
    driver: local

networks:
  bookshop_network:
    driver: bridge